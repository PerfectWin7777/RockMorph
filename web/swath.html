<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            color: #333;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #plot-main, #plot-3d {
            flex: 3;
            width: 100%;
            min-height: 260px;
        }

        #plot-3d { display: none; }

        /* 2D / 3D switch */
        #view-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-bottom: 1px solid #ddd;
            background: #f5f5f5;
            font-size: 12px;
        }
        #view-bar button {
            border: none;
            background: none;
            padding: 3px 10px;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            color: #555;
            font: inherit;
        }
        #view-bar button.active { color: #111; border-bottom-color: #2a78d6; font-weight: bold; }
        #view-bar label { margin-left: auto; color: #555; }
        #view-bar input { width: 52px; }

        #stats {
            padding: 6px 12px;
            background: #f5f5f5;
            border-top: 1px solid #ddd;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            font-size: 12px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            min-width: 80px;
        }

        .stat-label {
            color: #888;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            color: #222;
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div id="view-bar">
        <button id="btn-2d" class="active" onclick="setView('2d')">Profile</button>
        <button id="btn-3d" onclick="setView('3d')">3D block</button>
        <label id="ve-label" style="display:none">V.E.
            <input id="ve-input" type="number" min="0.5" max="50" step="0.5" value="2"
                   title="Vertical exaggeration of the 3D block" onchange="render3D()">
        </label>
    </div>
    <div id="plot-main"></div>
    <div id="plot-3d"></div>


    <div id="stats">
        <div class="stat-item">
            <span class="stat-label">LENGTH</span>
            <span class="stat-value" id="stat-length">—</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">MAX ELEV</span>
            <span class="stat-value" id="stat-max">—</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">MIN ELEV</span>
            <span class="stat-value" id="stat-min">—</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">MEAN ELEV</span>
            <span class="stat-value" id="stat-mean">—</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">TOTAL RELIEF</span>
            <span class="stat-value" id="stat-relief">—</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">DEM</span>
            <span class="stat-value" id="stat-dem">—</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">CRS</span>
            <span class="stat-value" id="stat-crs">—</span>
        </div>
    </div>

    <script src="js/qwebchannel.js"></script>
    <script src="js/plotly.min.js"></script>
    <script src="js/bridge.js"></script>

    <script>
        /**
         * swath.html — Swath Profile visualization
         * Two subplots:
         *   - Main: min / mean / max (+ optional Q1/Q3)
         *   - Secondary: local relief OR transversal hypsometry
         */

        var _currentData = null;

      /**
   * Main rendering function for Swath Profile.
   * Optimized for Subplots alignment and High-DPI Export.
   */
        function updatePlot(jsonData) {
            const data = JSON.parse(jsonData);
            _currentData = data;
            if (_view === '3d') render3D();
            const s = data.styles || {};

            // Helper to get style properties
            function getStyle(key, fallbackColor) {
                const cfg = s[key] || {};
                const color = cfg.color || fallbackColor;
                return {
                    line: {
                        color: color,
                        width: cfg.width || 1.5,
                        dash: cfg.dash || 'solid'
                    },
                    fillEnabled: cfg.fill || false,
                    fillcolor: color + '78'
                };
            }

            const traces = [];

            // --- 1. ELEVATION (TOP PANEL) ---
            const styleMin = getStyle('min', '#3498db');
            traces.push({
                x: data.distances, y: data.min,
                name: 'Min', type: 'scatter', mode: 'lines',
                line: styleMin.line, xaxis: 'x', yaxis: 'y',
                fill: styleMin.fillEnabled ? 'tozeroy' : 'none',
                fillcolor: styleMin.fillcolor,
                hovertemplate: 'Min: %{y:.1f} m<extra></extra>',
            });

            const styleMax = getStyle('max', '#e74c3c');
            traces.push({
                x: data.distances, y: data.max,
                name: 'Max', type: 'scatter', mode: 'lines',
                line: styleMax.line, xaxis: 'x', yaxis: 'y',
                fill: styleMax.fillEnabled ? 'tonexty' : 'none',
                fillcolor: styleMax.fillcolor,
                hovertemplate: 'Max: %{y:.1f} m<extra></extra>',
            });

            if (data.q1 && data.q3) {
                const styleQ1 = getStyle('q1', '#e67e22');
                const styleQ3 = getStyle('q3', '#e67e22');
                traces.push({
                    x: data.distances, y: data.q1,
                    name: 'Q1', type: 'scatter', mode: 'lines',
                    line: styleQ1.line, xaxis: 'x', yaxis: 'y',
                    fill: styleQ1.fillEnabled ? 'tozeroy' : 'none',
                    fillcolor: styleQ1.fillcolor,
                    hovertemplate: 'Q1: %{y:.1f} m<extra></extra>',
                });
                traces.push({
                    x: data.distances, y: data.q3,
                    name: 'Q3', type: 'scatter', mode: 'lines',
                    line: styleQ3.line, xaxis: 'x', yaxis: 'y',
                    fill: styleQ3.fillEnabled ? 'tonexty' : 'none',
                    fillcolor: styleQ3.fillcolor,
                    hovertemplate: 'Q3: %{y:.1f} m<extra></extra>',
                });
            }

            const styleMean = getStyle('mean', '#2c3e50');
            traces.push({
                x: data.distances, y: data.mean,
                name: 'Mean', type: 'scatter', mode: 'lines',
                line: styleMean.line, xaxis: 'x', yaxis: 'y',
                hovertemplate: 'Mean: <b>%{y:.1f} m</b><extra></extra>',
            });

            // --- 2. SECONDARY METRICS (BOTTOM PANEL) ---
            const hasRelief = !!(data.relief && data.relief.length);
            const hasHyps = !!(data.hyps && data.hyps.length);
            const hasSecondary = hasRelief || hasHyps;
            // xaxis.showline must be false when a secondary panel exists —
            // yaxis2 already closes the bottom of the subplot visually.
            // Keeping showline:true with an overlaying y3 causes a double x-axis line.
            const noSecondary = !hasRelief && !hasHyps;
            //const noSecondary = !hasSecondary;

            if (hasRelief) {
                const styleRelief = getStyle('relief', '#27ae60');
                traces.push({
                    x: data.distances, y: data.relief,
                    name: 'Local Relief', type: 'scatter', mode: 'lines',
                    line: styleRelief.line, xaxis: 'x', yaxis: 'y2',
                    fill: styleRelief.fillEnabled ? 'tozeroy' : 'none',
                    fillcolor: styleRelief.fillcolor,
                    hovertemplate: 'Relief: %{y:.1f} m<extra></extra>',
                });
            }

            if (hasHyps) {
                const styleHyps = getStyle('hyps', '#8e44ad');
                traces.push({
                    x: data.distances, y: data.hyps,
                    name: 'Hypsometry', type: 'scatter', mode: 'lines',
                    line: styleHyps.line, xaxis: 'x',
                    yaxis: hasRelief ? 'y3' : 'y2',
                    fill: styleHyps.fillEnabled ? 'tozeroy' : 'none',
                    fillcolor: styleHyps.fillcolor,
                    hovertemplate: 'THI: %{y:.3f}<extra></extra>',
                });
            }

            // --- 3. PROFESSIONAL LAYOUT CONFIG ---
            const layout = {
                title: {
                    text: data.title || '',
                    font: { family: 'Times New Roman', size: 14 },
                    y: 0.98 // Pushes title up for export
                },
                showlegend: true,
                legend: {
                    orientation: 'h', x: 0, y: 1.02,
                    xanchor: 'left', yanchor: 'bottom',
                    font: { size: 10 },
                    bgcolor: 'rgba(255,255,255,0.8)',
                    borderwidth: 1
                },

                // Main Elevation Axis
                yaxis: {
                    title: { text: 'Elevation (m)', standoff: 20 , font: { family: 'Times New Roman', size: 13 } },
                    domain: hasSecondary ? [0.35, 1] : [0, 1],
                    automargin: true,
                    gridcolor: '#cccccc',
                    showgrid: true,
                    showline: true,
                    ticks: 'outside',
                    linewidth: 1,
                    ticklen: 4,
                    tickwidth: 1,
                    tickfont: { family: 'Times New Roman', size: 12 },
                    dtick: data.y_dtick,
                    minor: {
                        showgrid: true,
                        gridcolor: '#eeeeee',
                        gridwidth: 0.5,
                        dtick: data.y_dtick / 4
                    }
                },

                // Relief / Secondary Axis
                yaxis2: {
                    title: { text: hasRelief ? 'Relief (m)' : 'THI', standoff: 20 , font: { family: 'Times New Roman', size: 13 } },
                    domain: [0, 0.25],
                    anchor: 'x',
                    automargin: true,
                    gridcolor: '#cccccc',
                    showgrid: true,
                    showline: true,
                    ticks: 'outside',
                    linewidth: 1,
                    ticklen: 4,
                    tickwidth: 1,
                    tickfont: { family: 'Times New Roman', size: 12 },
                    visible: hasSecondary
                },
                
                // Hypsometry Overlay (Right)
                yaxis3: {
                    title: { text: 'THI', standoff: 20, font: { family: 'Times New Roman', size: 13 } },
                    domain: [0, 0.25],
                    overlaying: 'y2',
                    side: 'right',
                    range: [0, 1],
                    // anchor: 'x',
                    automargin: true,
                    visible: hasHyps && hasRelief,
                    showgrid: false,
                    showline: hasHyps && hasRelief,
                    linewidth: 1,
                    ticklen: 4,
                    tickwidth: 1,
                    tickfont: { family: 'Times New Roman', size: 12 },
                    ticks: 'outside'
                },

                xaxis: {
                    title: { text: 'Distance (m)', standoff: 20 , font: { family: 'Times New Roman', size: 13 } },
                    anchor: hasSecondary ? 'y2' : 'y', // Perfectly aligned with the bottom-most plot
                    automargin: true,
                    gridcolor: '#cccccc',
                    showgrid: true,
                    dtick: data.x_dtick,
                    minor: {
                        showgrid: true,
                        gridcolor: '#eeeeee',
                        gridwidth: 0.5,
                        dtick: data.x_dtick / 4
                    },
                    showline: noSecondary ? true : false, // Show x-axis line only if there's no secondary plot
                    linewidth: 1,
                    ticklen : 4,
                    tickwidth: 1,
                    tickfont: { family: 'Times New Roman', size: 12 },
                    ticks : 'outside'
                },

                margin: { t: 60, b: 30, l: 80, r: 40 }, // Balanced margins
                hovermode: 'x unified',
                template: 'plotly_white',
                // Adds vertical guide line on hover
                spikedistance: -1,
                xaxis_spikemode: 'across'
            };

            // Use a single div for both plots = Perfect Alignment + Single Export
            Plotly.react('plot-main', traces, layout, { responsive: true });

            // Attach interactions ONLY ONCE
            _attachPlotlyEvents();

            // Update stats bar

            _updateStats(data);
        }

        // ── Stats bar ─────────────────────────────────────────────
        function _updateStats(data) {
            var means = data.mean.filter(function (v) { return v !== null; });
            var mins = data.min.filter(function (v) { return v !== null; });
            var maxs = data.max.filter(function (v) { return v !== null; });

            var globalMin = Math.min.apply(null, mins);
            var globalMax = Math.max.apply(null, maxs);
            var globalMean = means.reduce(function (a, b) {
                return a + b;
            }, 0) / means.length;

            document.getElementById('stat-length').textContent =
                (data.total_length_m / 1000).toFixed(2) + ' km';
            document.getElementById('stat-max').textContent =
                globalMax.toFixed(1) + ' m';
            document.getElementById('stat-min').textContent =
                globalMin.toFixed(1) + ' m';
            document.getElementById('stat-mean').textContent =
                globalMean.toFixed(1) + ' m';
            document.getElementById('stat-relief').textContent =
                (globalMax - globalMin).toFixed(1) + ' m';
            document.getElementById('stat-dem').textContent =
                data.dem_name || '—';
            document.getElementById('stat-crs').textContent =
                data.crs_name || '—';
        }

        // ── Canvas cursor tracking ────────────────────────────────

    // Global variable to prevent duplicate listeners
    let _eventsAttached = false;

    function _attachPlotlyEvents() {
        if (_eventsAttached) return;
        const gd = document.getElementById('plot-main');

        // Triggered when mouse moves over the plot
        gd.on('plotly_hover', function (data) {
            if (data.points && data.points.length > 0) {
                // x represents the distance in meters along the profile
                const distanceM = data.points[0].x;

                // Send the distance back to Python via the QWebChannel bridge
                if (window.bridge) {
                    window.bridge.on_plot_hover(distanceM);
                }
            }
        });

        // Triggered when mouse leaves a data point
        gd.on('plotly_unhover', function () {
            if (window.bridge) {
                window.bridge.on_plot_leave();
            }
        });

        _eventsAttached = true;
    }


    // ── 3D swath block ───────────────────────────────────────
    /*
     * The surface is the band actually sampled: x = distance along the
     * line (km), y = lateral offset (km, + = left of the line direction,
     * as the sampler generates it), z = elevation. The min / mean / max
     * envelopes of the 2D profile are drawn on the near (right) wall, so the
     * block and the classic swath profile read together. Hovering the
     * surface sends (distance, offset) to Python, which puts the point on
     * the map; hovering an envelope sends the distance only.
     */
    var _view = '2d';

    function setView(view) {
        _view = view;
        document.getElementById('btn-2d').classList.toggle('active', view === '2d');
        document.getElementById('btn-3d').classList.toggle('active', view === '3d');
        document.getElementById('plot-main').style.display = view === '2d' ? '' : 'none';
        document.getElementById('plot-3d').style.display = view === '3d' ? 'block' : 'none';
        document.getElementById('ve-label').style.display = view === '3d' ? '' : 'none';
        if (view === '3d') render3D();
        window.dispatchEvent(new Event('resize'));
    }

    function activeView() { return _view; }

    function render3D() {
        var data = _currentData;
        var gd = document.getElementById('plot-3d');
        if (!data || !data.grid_z) {
            gd.innerHTML = '<div style="padding:30px;color:#888;text-align:center">Run the swath to see the 3D block.</div>';
            return;
        }
        var styles = data.styles || {};
        function color(key, fallback) { return (styles[key] && styles[key].color) || fallback; }
        var km = function (v) { return v / 1000; };
        var xs = data.grid_distance.map(km);
        var ys = data.grid_offset.map(km);
        // Plotly surface: z[row = y index][column = x index] → transpose.
        var z = ys.map(function (_, j) { return data.grid_z.map(function (row) { return row[j]; }); });
        var zmin = Infinity, zmax = -Infinity;
        data.grid_z.forEach(function (row) { row.forEach(function (v) {
            if (v !== null) { zmin = Math.min(zmin, v); zmax = Math.max(zmax, v); } }); });
        // Envelopes on the NEAR (right, −offset) wall, facing the camera: on
        // the far wall the relief hid the min and mean curves.
        var wall = ys[0];
        var dist = data.distances.map(km);
        var traces = [{
            type: 'surface', x: xs, y: ys, z: z, showscale: false, opacity: 0.95,
            colorscale: [[0, '#6f8a5e'], [0.35, '#a7a77a'], [0.7, '#c9b48f'], [1, '#efebe4']],
            lighting: { ambient: 0.55, diffuse: 0.8, roughness: 0.9, specular: 0.05 },
            lightposition: { x: -10000, y: 10000, z: 20000 },
            hovertemplate: '%{x:.2f} km · offset %{y:.2f} km<br>%{z:.0f} m<extra></extra>',
        }];
        [['max', '#e74c3c'], ['mean', '#2c3e50'], ['min', '#3498db']].forEach(function (pair) {
            var values = data[pair[0]];
            if (!values) return;
            traces.push({
                type: 'scatter3d', mode: 'lines', name: pair[0], x: dist,
                y: dist.map(function () { return wall; }), z: values,
                line: { color: color(pair[0], pair[1]), width: 5 },
                hovertemplate: pair[0] + ' %{z:.0f} m · %{x:.2f} km<extra></extra>',
            });
        });
        var spanX = xs[xs.length - 1] - xs[0] || 1, spanY = ys[ys.length - 1] - ys[0] || 1;
        var span = Math.max(spanX, spanY);
        var ve = parseFloat(document.getElementById('ve-input').value) || 2;
        var zAspect = isFinite(zmax) ? (zmax - zmin) / 1000 * ve / span : 0.2;
        // A long, narrow band (e.g. 21 km × 6 km) becomes a thin ribbon at
        // true scale: its width is drawn at least 40 % of its length, and
        // the stretch is stated on the chart.
        var yAspect = spanY / span, widen = 1;
        if (yAspect < 0.4) { widen = 0.4 / yAspect; yAspect = 0.4; }
        var layout = {
            margin: { l: 0, r: 0, t: 0, b: 0 }, showlegend: true,
            legend: { orientation: 'h', x: 0, y: 1, font: { size: 10 } },
            scene: {
                aspectmode: 'manual',
                aspectratio: { x: spanX / span, y: yAspect, z: Math.max(zAspect, 0.05) },
                xaxis: { title: 'Distance (km)' },
                yaxis: { title: 'Offset (km)' },
                zaxis: { title: 'Z (m)' },
                camera: { eye: { x: -0.55, y: -1.45, z: 0.75 } },
            },
            annotations: [{
                xref: 'paper', yref: 'paper', x: 1, y: 0, xanchor: 'right', yanchor: 'bottom', showarrow: false,
                font: { size: 10, color: '#777' },
                text: 'V.E. ×' + ve + (widen > 1 ? ' · band width shown ×' + widen.toFixed(1) : '') +
                      ' · offset + = left of the line',
            }],
        };
        Plotly.react(gd, traces, layout, { responsive: true, displaylogo: false });
        if (!gd._rockmorphEvents) {
            gd.on('plotly_hover', function (event) {
                var p = event.points[0];
                if (!window.bridge) return;
                if (p.curveNumber === 0 && window.bridge.on_swath_point) {
                    window.bridge.on_swath_point(p.x * 1000, p.y * 1000);
                } else {
                    window.bridge.on_plot_hover(p.x * 1000);
                }
            });
            gd.on('plotly_unhover', function () { if (window.bridge) window.bridge.on_plot_leave(); });
            gd._rockmorphEvents = true;
        }
    }

    /** Export the visible view: SVG for the 2D profile, PNG for the WebGL 3D block. */
    function exportSwathActive() {
        if (_view !== '3d') { exportViaSvg('plot-main'); return; }
        var gd = document.getElementById('plot-3d');
        Plotly.toImage(gd, { format: 'png', width: gd.offsetWidth * 3, height: gd.offsetHeight * 3 })
            .then(function (url) { onBridgeReady(function (bridge) { bridge.receive_export(url); }); });
    }

    // deprecated: we now use plotly's built-in hover events instead of tracking mouse position on the canvas.
           /**
             * Updates a vertical reference line.
             * distanceM: distance from start of line in meters.
              * If distanceM is null, the cursor is removed.
             */
        function updateCursor(distanceM) {
            // If plot is not yet created, abort
            const gd = document.getElementById('plot-main');
            if (!gd || !gd.data) return;

            
            // If null is received (mouse too far), clear all shapes
            if (distanceM === null || distanceM === undefined) {
                Plotly.relayout('plot-main', {
                    shapes: []
                });
                return;
            }

            const cursorLine = {
                type: 'line',
                x0: distanceM,
                x1: distanceM,
                yref: 'paper', // Full height of the chart area
                y0: 0,
                y1: 1,
                line: {
                    color: 'rgba(231, 76, 60, 0.8)', // Red
                    width: 1,
                    dash: 'solid'
                }
            };

            // relayout is fast: it only updates the "shapes" layer
            Plotly.relayout('plot-main', {
                shapes: [cursorLine]
            });
        }

    </script>

</body>

</html>
