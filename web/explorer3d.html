<!-- web/explorer3d.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RockMorph 3D Explorer Viewport</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #viewport-container {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Custom lightweight overlay for status messages */
        #status-overlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #888;
            font-size: 11px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 8px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div id="viewport-container"></div>
    <div id="status-overlay">Scene Status: Empty (Awaiting DEM Layer)</div>

    <!-- Load Local JS Dependencies (reused with file:/// paths injected by Python) [1.1.3] -->
    <script src="js/three.min.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script src="js/qwebchannel.js"></script>
    <script src="js/bridge.js"></script>
    <script src="js/colormaps_data.js"></script>
    <script src="js/explorer3d_render.js"></script>

</body>

</html>
