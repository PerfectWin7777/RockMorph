<!-- web/explorer3d.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RockMorph 3D Explorer Viewport</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #viewport-container {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Custom lightweight overlay for status messages */
        #status-overlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #888;
            font-size: 11px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 8px;
            border-radius: 4px;
        }


        /* Dynamic Elevation Legend Widget (Top-Left and Semi-transparent) */
        #legend-overlay {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(20, 20, 20, 0.25); /* Soft translucent background */
            backdrop-filter: blur(4px); /* Elegant modern glass effect */
            color: #f0f0f0;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            pointer-events: none;
            display: none; /* Hidden until DEM is loaded */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1); /* Subtle boundary line */
            z-index: 100;
        }

        #legend-title {
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
            font-size: 12px;
        }

        #legend-gradient-wrapper {
            display: flex;
            flex-direction: row;
            align-items: stretch;
        }

        #legend-canvas {
            border-radius: 2px;
            border: 1px solid #555;
        }

        #legend-labels {
            position: relative;
            margin-left: 12px;
            min-width: 65px;
        }

        .legend-tick {
            position: absolute;
            transform: translateY(-50%);
            left: 0;
            white-space: nowrap;
        }

    </style>
</head>

<body>

    <div id="viewport-container"></div>
    <div id="status-overlay">Scene Status: Empty (Awaiting DEM Layer)</div>
    
    <!-- Floating Dynamic Elevation Legend Widget [New] -->
    <div id="legend-overlay">
        <div id="legend-title">Elevation (m)</div>
        <div id="legend-gradient-wrapper">
            <canvas id="legend-canvas" width="22" height="180"></canvas>
            <div id="legend-labels"></div>
        </div>
    </div>

    <!-- Load Local JS Dependencies (reused with file:/// paths injected by Python) [1.1.3] -->
    <script src="js/three.min.js"></script>
    <script src="js/TrackballControls.js"></script>
    <script src="js/qwebchannel.js"></script>
    <script src="js/bridge.js"></script>
    <script src="js/colormaps_data.js"></script>
    <script src="js/explorer3d_render.js"></script>

</body>

</html>
